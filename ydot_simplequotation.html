ite" href="https://www.ydotstudio.com/" target="_blank" rel="noopener noreferrer">官方網站 ↗</a></header><main><div class="intro"><p class="eyebrow">A LITTLE IDEA, A GOOD START.</p><h1>你的點子，需要多少預算？</h1><p>選擇設計項目與款數，先抓個預算，再一起聊聊你的想法。</p></div><div class="layout"><section class="panel chooser" aria-labelledby="chooseTitle"><h2 class="section-title" id="chooseTitle"><span class="step">1</span>選擇你需要的設計</h2><label for="service">設計項目</label><select id="service"><option value="">請選擇設計項目</option></select><p id="spec">選好項目，即可查看參考起價。</p><div id="sides" hidden><span class="field-title">設計面數</span><div class="options"><button class="option active" id="single" type="button" aria-pressed="true">單面</button><button class="option" id="double" type="button" aria-pressed="false">雙面</button></div></div><div class="count-price"><div class="quantity"><label for="qty">設計款數</label><input id="qty" type="number" min="1" max="999" step="1" value="1" inputmode="numeric"></div><div class="unit">每款參考起價<strong id="unit">—</strong></div></div><p class="hint">款數指不同的設計，不是印刷張數。</p><button class="primary" id="add" disabled type="button">加入估價清單 ＋</button></section><section class="panel" aria-labelledby="summaryTitle"><h2 class="section-title" id="summaryTitle"><span class="step">2</span>你的預估費用</h2><div id="items"></div><div class="total" aria-live="polite" aria-atomic="true"><span>設計費用預估</span><strong class="amount"><small>NT$</small><span id="total" style="font-size:inherit">0</span><small id="from" hidden> 起</small></strong></div><p class="note">以上依價目表起價估算，僅供預算參考，非正式報價。實際費用需依需求與規格確認；稅金與印刷製作費用請另洽工作室確認。</p><button class="secondary" id="copy" type="button" disabled>複製估價內容</button><a class="next" href="https://www.ydotstudio.com/" target="_blank" rel="noopener noreferrer">到官網聯絡我們，聊聊需求 ↗</a><p class="status" id="status" role="status"></p><div id="copyFallback" hidden><label for="copyText">請選取並複製以下內容</label><textarea id="copyText" readonly></textarea></div></section></div><p class="foot">歪點子創意設計工作室 · 好設計，從一個點子開始。<br>估價以本工具內建價目為準；重新整理頁面會清除清單。</p></main><script>
const CATALOG=[{"id": "dm4", "cat": "DM 傳單", "name": "四摺 DM 設計", "spec": "A4 · 21 × 29.7 cm", "single": 6000, "double": 8000}, {"id": "dm3", "cat": "DM 傳單", "name": "三摺 DM 設計", "spec": "A4 · 21 × 29.7 cm", "single": 5000, "double": 7000}, {"id": "dm", "cat": "DM 傳單", "name": "DM 設計", "spec": "A4 · 21 × 29.7 cm", "single": 3000, "double": 4500}, {"id": "poster4", "cat": "海報設計", "name": "海報設計 A4", "spec": "21 × 29.7 cm", "single": 5000, "double": 7000}, {"id": "poster2", "cat": "海報設計", "name": "海報設計 A2・菊對開", "spec": "42 × 59.4 cm", "single": 9000, "double": 15000}, {"id": "poster1", "cat": "海報設計", "name": "海報設計 A1・菊全", "spec": "84 × 59.4 cm", "single": 11000, "double": 18000}, {"id": "ticket", "cat": "宣傳品", "name": "票券、禮券類設計", "spec": "A4 以下", "single": 3000, "double": 5000}, {"id": "invite", "cat": "宣傳品", "name": "邀請卡、賀卡設計", "spec": "A4 以下", "single": 3000, "double": 5000}, {"id": "sticker", "cat": "宣傳品", "name": "貼紙設計", "spec": "14.8 × 21 cm 以下", "single": 2000, "double": null}, {"id": "card", "cat": "宣傳品", "name": "名片、店卡設計", "spec": "9 × 5.4 cm", "single": 2000, "double": 3000}, {"id": "web", "cat": "網頁／社群", "name": "網站架設設計 RWD", "spec": "依客戶要求", "single": 20000, "double": null}, {"id": "banner", "cat": "網頁／社群", "name": "網頁 Banner 設計", "spec": "依客戶要求 · 一式", "single": 2000, "double": null}, {"id": "socialbanner", "cat": "網頁／社群", "name": "社群／商品橫幅設計", "spec": "依客戶要求 · 一式", "single": 2000, "double": null}, {"id": "social", "cat": "網頁／社群", "name": "社群／商品圖文設計", "spec": "依客戶要求 · 一式", "single": 1500, "double": null}, {"id": "stage", "cat": "活動主視覺", "name": "舞台背板", "spec": "依客戶要求", "single": 10000, "double": null}, {"id": "kv", "cat": "活動主視覺", "name": "主圖設計", "spec": "依客戶要求", "single": 12000, "double": null}];
const $=id=>document.getElementById(id), money=n=>n.toLocaleString('zh-TW');
let side='single',rows=[];
const cats=[...new Set(CATALOG.map(x=>x.cat))];
for(const c of cats){const group=document.createElement('optgroup');group.label=c;for(const p of CATALOG.filter(x=>x.cat===c)){const o=document.createElement('option');o.value=p.id;o.textContent=p.name;group.append(o)}$('service').append(group)}
function chosen(){return CATALOG.find(p=>p.id===$('service').value)}
function update(){const p=chosen();$('sides').hidden=!p||!p.double;$('spec').textContent=p?p.spec:'選好項目，即可查看參考起價。';$('unit').textContent=p?'NT$ '+money(p[side])+' 起':'—';$('add').disabled=!p;for(const v of ['single','double']){$(v).classList.toggle('active',v===side);$(v).setAttribute('aria-pressed',String(v===side))}}
$('service').onchange=()=>{side='single';update()};for(const v of ['single','double'])$(v).onclick=()=>{side=v;update()};
function render(){const box=$('items');box.replaceChildren();if(!rows.length){box.innerHTML='<div class="empty"><span>＋</span>還沒有項目<br>加入設計，預估金額就會出現在這裡。</div>'}for(const [i,r] of rows.entries()){const p=CATALOG.find(x=>x.id===r.id);const el=document.createElement('div');el.className='item';el.innerHTML=`<div class="item-top"><strong>${p.name}</strong><button type="button" class="remove" aria-label="移除${p.name}">移除</button></div><div class="item-detail"><span>${p.double?(r.side==='single'?'單面':'雙面')+' · ':''}${r.qty} 款 × NT$ ${money(p[r.side])}</span><b>NT$ ${money(p[r.side]*r.qty)}</b></div>`;el.querySelector('button').onclick=()=>{rows.splice(i,1);render();$('status').textContent='已移除項目。'};box.append(el)}$('total').textContent=money(rows.reduce((a,r)=>a+CATALOG.find(p=>p.id===r.id)[r.side]*r.qty,0));$('from').hidden=!rows.length;$('copy').disabled=!rows.length;$('copyFallback').hidden=true;}
$('add').onclick=()=>{const p=chosen(),q=$('qty');if(!p)return;if(!q.checkValidity()||!Number.isInteger(Number(q.value))){q.reportValidity();return}const qty=Number(q.value);const r=rows.find(x=>x.id===p.id&&x.side===side);if(r)r.qty+=qty;else rows.push({id:p.id,side,qty});render();$('status').textContent='已加入 '+p.name+'，可繼續加入其他項目。'};
function text(){return '歪點子｜設計費用預估\n\n'+rows.map(r=>{const p=CATALOG.find(x=>x.id===r.id);return `${p.name}${p.double?'（'+(r.side==='single'?'單面':'雙面')+'）':''}｜${r.qty} 款｜NT$ ${money(p[r.side]*r.qty)} 起`}).join('\n')+'\n\n預估合計：NT$ '+$('total').textContent+' 起\n此為起價估算，非正式報價。實際費用依需求與規格確認；稅金與印刷製作費用另洽工作室確認。\nhttps://www.ydotstudio.com/'}
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(text());$('status').textContent='已複製，可以貼給工作室討論需求。'}catch(e){$('copyFallback').hidden=false;$('copyText').value=text();$('copyText').focus();$('copyText').select();$('status').textContent='請手動複製下方估價內容。'}};render();
</script></body></html>
